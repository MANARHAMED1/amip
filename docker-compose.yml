services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "listen_addresses=*"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amip}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/amip-sql/01-schema.sql:ro
      - ./docker/01b-fix-actif.sql:/amip-sql/01b-fix-actif.sql:ro
      - ./database/data_inserts.sql:/amip-sql/02-data.sql:ro
      - ./generated_data:/amip-sql/generated_data:ro
      - ./warehouse/schema.sql:/amip-sql/03-warehouse-schema.sql:ro
      - ./warehouse/views.sql:/amip-sql/04-warehouse-views.sql:ro
      - ./docker/init.sql:/amip-sql/05-users.sql:ro
      - ./docker/init-all.sh:/docker-entrypoint-initdb.d/init-all.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-amip}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      AMIP_DB_HOST: db
      AMIP_DB_PORT: "5432"
      AMIP_DB_NAME: ${AMIP_DB_NAME:-amip}
      AMIP_DB_USER: ${AMIP_DB_USER:-postgres}
      AMIP_DB_PASSWORD: ${AMIP_DB_PASSWORD:-change_me_in_production}
      AMIP_JWT_SECRET: ${AMIP_JWT_SECRET:-change_me_to_a_random_string}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-amip@amm.local}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-admin@amm.local}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

  etl:
    build:
      context: ./etl
      dockerfile: Dockerfile
    environment:
      AMIP_DB_HOST: db
      AMIP_DB_PORT: "5432"
      AMIP_DB_NAME: ${AMIP_DB_NAME:-amip}
      AMIP_DB_USER: ${AMIP_DB_USER:-postgres}
      AMIP_DB_PASSWORD: ${AMIP_DB_PASSWORD:-change_me_in_production}
    depends_on:
      db:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

volumes:
  pgdata:
